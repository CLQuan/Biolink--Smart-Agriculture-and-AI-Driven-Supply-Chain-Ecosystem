version: "3.9"

# Local development data layer for Bio-Link (SDD §2.2).
# Brings up PostgreSQL (durable store) and Redis (cache + telemetry buffer).

services:
  postgres:
    image: postgres:16-alpine
    container_name: biolink-postgres
    environment:
      POSTGRES_USER: biolink
      POSTGRES_PASSWORD: biolink
      POSTGRES_DB: biolink
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biolink"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: biolink-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
